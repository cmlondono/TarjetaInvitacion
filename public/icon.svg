<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente dorado de papelería protocolaria -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B48222" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Gradiente de fondo del tarjetón en tono obsidiana/slate -->
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Filtro de profundidad para tarjeta en relieve -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Contenedor exterior estilizado (Squircle de alta gama) -->
  <rect width="512" height="512" rx="128" fill="url(#bgLinear)" />

  <!-- Filete exterior perimetral dorado -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="104"
    stroke="url(#goldLinear)"
    stroke-width="12"
    stroke-opacity="0.5"
    fill="none"
  />

  <!-- Tarjetón base en relieve con ángulo sutil de invitación de gala -->
  <rect
    x="100"
    y="90"
    width="312"
    height="332"
    rx="32"
    fill="#1E293B"
    stroke="url(#goldLinear)"
    stroke-width="6"
    stroke-opacity="0.6"
    transform="rotate(-5 256 256)"
    filter="url(#cardShadow)"
  />

  <!-- Tarjeta frontal principal de papelería fina (Tarjetón formal) -->
  <rect
    x="108"
    y="98"
    width="296"
    height="316"
    rx="28"
    fill="#0B0F19"
    stroke="url(#goldLinear)"
    stroke-width="10"
    filter="url(#cardShadow)"
  />

  <!-- Marco interior punteado clásico de impresión tipográfica -->
  <rect
    x="132"
    y="122"
    width="248"
    height="268"
    rx="18"
    stroke="url(#goldLinear)"
    stroke-width="4"
    stroke-dasharray="14 10"
    stroke-opacity="0.85"
    fill="none"
  />

  <!-- Monograma Señorial "T" para TARJETÓN con serifa de imprenta artesanal -->
  <path
    d="M176 172 H336 V212 H296 L284 224 V330 H304 V352 H208 V330 H228 V224 L216 212 H176 V172 Z"
    fill="url(#goldLinear)"
  />

  <!-- Filete de luz interior en la letra T -->
  <path
    d="M196 182 H316 V196 H276 V336 H236 V196 H196 V182 Z"
    fill="#FFFFFF"
    opacity="0.2"
  />

  <!-- Destello / Estrella de Protocolo superior -->
  <polygon
    points="256,134 262,148 276,154 262,160 256,174 250,160 236,154 250,148"
    fill="url(#goldLinear)"
  />

  <!-- Sellos en las cuatro esquinas de la tarjeta -->
  <circle cx="148" cy="138" r="6" fill="url(#goldLinear)" />
  <circle cx="364" cy="138" r="6" fill="url(#goldLinear)" />
  <circle cx="148" cy="374" r="6" fill="url(#goldLinear)" />
  <circle cx="364" cy="374" r="6" fill="url(#goldLinear)" />
</svg>